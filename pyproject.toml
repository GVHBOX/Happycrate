[project]
name = "happycrate"
version = "1.0.0"
description = "磁力搜索聚合与下载投递工具"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pywebview==5.4",
    "pythonnet>=3.0.5",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.downloaders"]
