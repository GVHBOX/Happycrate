name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: 建虚拟环境
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install .
          .venv\Scripts\python.exe -m pip install pyinstaller

      - name: 校验版本号与 tag 一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $want = $tag.TrimStart("v")
          $got = (.venv\Scripts\python.exe -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])").Trim()
          if ($got -ne $want) {
            Write-Error "pyproject.toml 版本 $got 与 tag $tag 不一致"
            exit 1
          }

      - name: 单元测试
        shell: pwsh
        run: |
          & ".\.venv\Scripts\python.exe" -m pip list --format=freeze |
            Select-String -Pattern 'pywebview|pythonnet|pywin32|pyinstaller'
          & ".\.venv\Scripts\python.exe" -X utf8 -m unittest discover -t . -s tests -p "test_*.py" *> unit-test.log
          $code = $LASTEXITCODE
          Get-Content unit-test.log
          Select-String -Path unit-test.log -Pattern '^(FAIL|ERROR): (.+)' |
            ForEach-Object { Write-Host "::error::$($_.Matches[0].Groups[2].Value)" }
          Select-String -Path unit-test.log -Pattern '^(FAILED|OK)' |
            ForEach-Object { Write-Host "::notice::$($_.Line)" }
          exit $code

      - name: 打包
        run: .venv\Scripts\python.exe -m PyInstaller happycrate.spec --noconfirm

      - name: 压缩产物
        shell: pwsh
        run: Compress-Archive -Path dist\happycrate\* -DestinationPath happycrate-win64.zip

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: happycrate-win64.zip
