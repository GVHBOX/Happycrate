<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>happycrate</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/motion.css">
<link rel="stylesheet" href="styles/base.css">
</head>
<body>
<div class="titlebar">
  <button class="tb-home" id="tbHome" title="Happycrate">
    <img class="tb-logo" src="logo.png" alt="">
    <span class="tb-title" id="tbTitle">Happycrate</span>
  </button>
  <div class="tb-drag pywebview-drag-region"></div>
  <div class="tb-btns">
    <button class="tb-btn" id="tbMin" title="最小化">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
        <path d="M1 5h8" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
    </button>
    <button class="tb-btn" id="tbMax" title="最大化">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
        <rect x="1.5" y="1.5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1"/></svg>
    </button>
    <button class="tb-btn close" id="tbClose" title="关闭">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
        <path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>
<div id="app"></div>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/motion.js"></script>
<script src="js/views/sources.js"></script>
<script src="js/views/search.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/diagnostics.js"></script>
<script>
(function(){
  if (new URLSearchParams(location.search).has("static")){
    document.documentElement.classList.add("static");
  }

  var app = document.getElementById("app");
  var current = null;

  function go(){
    var name = location.hash.replace("#", "") || "search";
    if (name === current) return;
    current = name;
    app.innerHTML = "";
    if (name === "search") HC.views.search.mount(app);
    else if (name === "settings") HC.views.settings.mount(app);
    else HC.views.sources.mount(app);
  }

  window.addEventListener("hashchange", go);
  go();
  document.getElementById("tbHome").onclick = function(){
    var name = location.hash.replace("#", "") || "search";
    if (name !== "search"){
      if (HC.views.search.enterHero) HC.views.search.enterHero();
      location.hash = "search";
      return;
    }
    if (HC.views.search.toggleHero) HC.views.search.toggleHero();
  };

  function applyFont(v){
    var n = parseInt(v, 10);
    if (n >= 12 && n <= 24) document.documentElement.style.setProperty("--fr", String(n / 13));
  }
  HC.applyFont = applyFont;
  HC.applyTheme = function(t){
    document.body.classList.toggle("dark", t === "dark");
    syncWindowTone();
  };
  HC.applyBrand = function(v){
    document.body.setAttribute("data-brand", v || "");
  };

  var TONE = {light: "#FFFFFF", dark: "#131419"};
  var DIMMED = {light: "#A3A3AA", dark: "#6D6D70"};

  function syncWindowTone(){
    var dark = document.body.classList.contains("dark");
    var dim = !!document.querySelector(".backdrop");
    HC.api.setWindowTone(dim ? DIMMED[dark ? "dark" : "light"]
                             : TONE[dark ? "dark" : "light"]);
  }
  HC.syncWindowTone = syncWindowTone;

  var toneTimer = 0;
  function watchBackdrop(){
    clearTimeout(toneTimer);
    toneTimer = setTimeout(syncWindowTone, 30);
  }
  document.addEventListener("DOMContentLoaded", function(){
    new MutationObserver(watchBackdrop).observe(document.body, {childList: true});
  });

  function loadSettings(){
    return HC.api.getSettings().then(function(s){
      if (!s) return;
      applyFont(s.ui_font_size);
      HC.applyTheme(s.theme);
      HC.applyBrand(s.brand);
    });
  }

  function loadInfo(){
    return HC.api.appInfo().then(function(info){
      if (info && info.version){
        document.getElementById("tbTitle").textContent = "Happycrate v" + info.version;
      }
    });
  }

  loadSettings().catch(function(err){ console.warn("getSettings failed", err); });
  loadInfo().catch(function(err){ console.warn("appInfo failed", err); });
  HC.api.onLive(function(){
    loadSettings().catch(function(err){ console.warn("getSettings failed", err); });
    loadInfo().catch(function(){});
  });
})();

(function(){
  function call(name){
    var api = window.pywebview && window.pywebview.api;
    if (api && typeof api[name] === "function") api[name]();
  }
  document.getElementById("tbMin").onclick = function(){ call("win_min"); };
  document.getElementById("tbMax").onclick = function(){ call("win_max"); };
  document.getElementById("tbClose").onclick = function(){ call("win_close"); };
  var drag = document.querySelector(".tb-drag");
  drag.addEventListener("dblclick", function(){ call("win_max"); });
})();
</script>
</body>
</html>
